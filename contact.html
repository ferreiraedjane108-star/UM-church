<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | UM Church</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F6F1E7;font-family:Arial,sans-serif}
header{
  background:white;height:70px;padding:0 40px;
  display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);position:sticky;top:0;z-index:1000;
}
.logo-text{font-weight:900;font-size:22px;line-height:0.9;color:#111}
.logo-text span{display:block;font-size:10px;letter-spacing:3px;font-weight:600;color:#666;margin-top:3px}
nav{display:flex;gap:8px}
nav a{text-decoration:none;color:#555;padding:9px 20px;border-radius:25px;font-size:14px;background:#F2F2F2}
nav a.active{background:#2B2E4A;color:white !important}
nav a:hover{background:#EFE9DB}
.main-card{background:white;max-width:1100px;margin:30px auto;padding:35px;border-radius:22px;box-shadow:0 8px 25px rgba(0,0,0,0.06)}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:35px;margin-top:25px}
#map{height:480px;width:100%;border-radius:18px;border:1px solid #ddd;z-index:1}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-weight:bold;margin-bottom:6px;color:#2B2E4A;font-size:14px}
.form-group input, .form-group textarea, .form-group select{
  width:100%;padding:12px 14px;border:1px solid #E8DDC8;border-radius:10px;background:#FFFCF6;font-size:14px
}
.form-group textarea{height:120px;resize:vertical}
.btn-submit{background:#2B2E4A;color:white;padding:13px 28px;border:none;border-radius:25px;cursor:pointer;font-weight:bold;width:100%}
.btn-submit:hover{background:#1f2235}
@media(max-width:800px){.contact-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="logo-text">umchurch<span>HOPE & FAITH</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="enquiry.html">Enquiry</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>

<div class="main-card">
  <h1 style="text-align:center;">Contact Us</h1>
  <p style="text-align:center;color:#777;margin-top:8px;">UM Church - 123 Faith Road, Cape Town - Open 7am to 4pm daily</p>
  
  <div class="contact-grid">
    <!-- LADO ESQUERDO - FORM -->
    <div>
      <h3>Send us a message</h3>
      <form id="contactForm" style="margin-top:18px;">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" placeholder="John Smith" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="john@email.com" required>
        </div>
        <div class="form-group">
          <label>Subject</label>
          <select>
            <option>Sunday Service</option>
            <option>Youth Ministry</option>
            <option>Prayer Request</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea placeholder="Write your message..." required></textarea>
        </div>
        <button type="submit" class="btn-submit">Send Message</button>
        <p id="formMsg" style="margin-top:12px;color:green;display:none;font-weight:bold;">✓ Message sent! God bless you.</p>
      </form>
    </div>

    <!-- LADO DIREITO - MAPA -->
    <div>
      <div id="map"></div>
      <div style="margin-top:18px;color:#444;line-height:1.8;background:#F8F3EB;padding:16px;border-radius:12px;">
        <b>Address:</b> 123 Faith Road, Cape Town<br>
        <b>Phone:</b> +27 21 123 4567<br>
        <b>Email:</b> hello@umchurch.co.za<br>
        <b>Hours:</b> 7am - 4pm daily
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var map = L.map('map').setView([-33.9249, 18.4241], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(map);
  L.marker([-33.9249, 18.4241]).addTo(map)
    .bindPopup('<b>UM Church</b><br>123 Faith Road').openPopup();
  setTimeout(function(){ map.invalidateSize(); }, 600);

  // FORM FUNCIONA
  document.getElementById('contactForm').addEventListener('submit', function(e){
    e.preventDefault();
    document.getElementById('formMsg').style.display='block';
    this.reset();
    setTimeout(()=>{ document.getElementById('formMsg').style.display='none'; }, 3000);
  });
});
</script>
</body>
</html>
